# Checks on every push to main and every pull request, and before every
# release. The repository lives on Codeberg and is push-mirrored here, where
# this runs.
name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_call:

# Read-only unless a job asks for more.
permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
            # The version releases are built with.
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: 'npm'
            # The filter tests run a real pandoc, pinned so citeproc's output does not drift under them.
            # The checksum pins the file too, so a replaced download fails here instead of being installed.
            - name: Install pandoc
              run: |
                  curl -fsSLo pandoc.deb https://github.com/jgm/pandoc/releases/download/3.7.0.2/pandoc-3.7.0.2-1-amd64.deb
                  echo "4db8bad3d9f8451a3d52171664f3c58b08af6450fbd54a28dd05f6b00b0bbb04  pandoc.deb" | sha256sum -c -
                  sudo dpkg -i pandoc.deb
            - run: npm ci
            - run: npm run build
            - run: npm run lint
            - run: npm test

    # The flake's package, so its npmDepsHash can't fall behind package-lock.json.
    nix:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
            - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
            - run: nix flake check -L
